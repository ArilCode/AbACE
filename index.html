<body>
<div class="wrap">
<header class="hero">
<div class="brand">ACE • STUDENT SYSTEM</div>
<h1>Absensi Siswa 📚</h1><p>Pilih kelas dulu, 1 siswa / mapel / hari</p>
<div class="clock"><div id="time">--:--:--</div><div id="date">Memuat tanggal...</div><span class="wib">🌏 Waktu Indonesia Barat (WIB)</span></div>
</header>
<section class="card">
<h2>📝 Form Absensi</h2>
<div id="jadwalInfo" class="jadwalBox">Pilih kelas untuk lihat jadwal hari ini</div>
<form id="form">
<label class="title">Pilih Kelas</label>
<select id="kelas" required>
  <option value="">-- Pilih Kelas --</option>
  <option value="X E">X E</option>
  <option value="XI F">XI F</option>
  <option value="XII MIPA">XII MIPA</option>
</select>

<label class="title">Nama Siswa</label>
<select id="nama" required><option value="">-- Pilih Kelas Dulu --</option></select>
<div id="hintNama" class="auto-hint"></div>

<label class="title">Mata Pelajaran</label>
<select id="mapel" required><option value="">-- Pilih Kelas Dulu --</option></select>
<div id="hintMapel" class="auto-hint"></div>

<label class="title">Guru Mapel</label>
<select id="guru" required><option value="">-- Pilih Mapel Dulu --</option></select>
<div id="hintGuru" class="auto-hint"></div>

<label class="title">Status Kehadiran</label>
<div class="status">
<label class="opt"><input type="radio" name="status" value="Hadir" required><span>✅ Hadir</span></label>
<label class="opt"><input type="radio" name="status" value="Izin"><span>📩 Izin</span></label>
<label class="opt"><input type="radio" name="status" value="Sakit"><span>🤒 Sakit</span></label>
<label class="opt"><input type="radio" name="status" value="Alfa"><span>❌ Alfa</span></label>
</div>
<button class="send" id="send" type="submit">Kirim Absensi</button>
<div class="success" id="success"></div>
</form>
<p class="note">data tersimpan di DataBase</p>
</section>
<div class="footer">© <script>document.write(new Date().getFullYear())</script> • Made with 🖤 by ACE (ArilCode Engineer)</div>
</div>

</body>
