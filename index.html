<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sedang Maintenance</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="container">
    <div class="gears" aria-hidden="true">
      <svg class="gear gear-big" viewBox="0 0 100 100">
        <g fill="currentColor">
          <circle cx="50" cy="50" r="32"/>
          <rect x="43" y="6" width="14" height="20" rx="3"/>
          <rect x="43" y="6" width="14" height="20" rx="3" transform="rotate(45 50 50)"/>
          <rect x="43" y="6" width="14" height="20" rx="3" transform="rotate(90 50 50)"/>
          <rect x="43" y="6" width="14" height="20" rx="3" transform="rotate(135 50 50)"/>
          <rect x="43" y="6" width="14" height="20" rx="3" transform="rotate(180 50 50)"/>
          <rect x="43" y="6" width="14" height="20" rx="3" transform="rotate(225 50 50)"/>
          <rect x="43" y="6" width="14" height="20" rx="3" transform="rotate(270 50 50)"/>
          <rect x="43" y="6" width="14" height="20" rx="3" transform="rotate(315 50 50)"/>
        </g>
        <circle cx="50" cy="50" r="13" fill="var(--bg)"/>
      </svg>
      <svg class="gear gear-small" viewBox="0 0 100 100">
        <g fill="currentColor">
          <circle cx="50" cy="50" r="32"/>
          <rect x="43" y="6" width="14" height="20" rx="3"/>
          <rect x="43" y="6" width="14" height="20" rx="3" transform="rotate(60 50 50)"/>
          <rect x="43" y="6" width="14" height="20" rx="3" transform="rotate(120 50 50)"/>
          <rect x="43" y="6" width="14" height="20" rx="3" transform="rotate(180 50 50)"/>
          <rect x="43" y="6" width="14" height="20" rx="3" transform="rotate(240 50 50)"/>
          <rect x="43" y="6" width="14" height="20" rx="3" transform="rotate(300 50 50)"/>
        </g>
        <circle cx="50" cy="50" r="13" fill="var(--bg)"/>
      </svg>
    </div>

    <h1>Sedang <span class="accent">Maintenance</span></h1>
    <p class="subtitle">
      Kami sedang melakukan pemeliharaan sistem untuk meningkatkan layanan.
      Mohon maaf atas ketidaknyamanannya, kami akan segera kembali.
    </p>

    <div class="countdown" aria-live="polite">
      <div class="box"><span id="hours">00</span><small>Jam</small></div>
      <div class="box"><span id="minutes">00</span><small>Menit</small></div>
      <div class="box"><span id="seconds">00</span><small>Detik</small></div>
    </div>

    <div class="progress" role="progressbar" aria-label="Progres maintenance">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <p class="status" id="status">Memperbarui sistem...</p>

    <p class="contact">
      Butuh bantuan? Hubungi
      <a href="mailto: arilhidayat202@gmail.com">arilhidayat202@gmail.com</a>
    </p>
  </main>

  <script src="./script.js"></script>
</body>
</html>
